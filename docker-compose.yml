services:
  syllabicator:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=dev-secret-key
      - HOST=0.0.0.0
      - PORT=5000
      - FLASK_ENV=development
      - OPEN_BROWSER=0
      - LOG_FILE=/app/logs/app.log
      - TRACE_MARKDOWN_FILE=/app/traces/DYNAMICALLY-log.md
      - WORD_BANK_DB_PATH=/app/instance/word_bank.sqlite3
    volumes:
      - syllabicator_logs:/app/logs
      - syllabicator_traces:/app/traces
      - syllabicator_instance:/app/instance
    command: ["python", "run.py"]

volumes:
  syllabicator_logs:
  syllabicator_traces:
  syllabicator_instance:

services:
  syllabicator:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=dev-secret-key
      - HOST=0.0.0.0
      - PORT=5000
      - FLASK_ENV=development
      - OPEN_BROWSER=0
    volumes:
      - .:/app
    command: ["python", "run.py"]
